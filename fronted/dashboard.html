<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord</title>
</head>
<body>
    <h1>Tableau de bord</h1>
    
    <div>
        <h2>Bienvenue, <span id="user-name">Utilisateur</span> !</h2>
    </div>
    
    <button id="toggle-info">Vos informations</button>
    
    <div id="info-container" style="display: none;">
        <h3>Vos informations</h3>
        <p><strong>Nom:</strong> <span id="display-name">-</span></p>
        <p><strong>Email:</strong> <span id="display-email">-</span></p>
        <button id="redirect-voitures">Voir les voitures</button>
    </div>

    <!-- Nouvelle section pour les voitures réservées -->
    <div id="reservations-section">
        <h3>Vos voitures réservées</h3>
        <div id="reservations-loading">Chargement de vos réservations...</div>
        <div id="reservations-container"></div>
        <div id="no-reservations" style="display: none;">Vous n'avez aucune réservation pour le moment.</div>
    </div>

    <script>
        // Récupérer les informations de l'utilisateur connecté
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        const token = localStorage.getItem('token');
        
        // Afficher les informations de l'utilisateur
        document.getElementById('user-name').textContent = currentUser.name || 'Utilisateur';
        document.getElementById('display-name').textContent = currentUser.name || '-';
        document.getElementById('display-email').textContent = currentUser.email || '-';
        
        // Fonctionnalité du bouton d'affichage des informations
        document.getElementById('toggle-info').addEventListener('click', function() {
            const infoContainer = document.getElementById('info-container');
            
            if (infoContainer.style.display === 'block') {
                infoContainer.style.display = 'none';
            } else {
                infoContainer.style.display = 'block';
            }
        });
        
        // Fonctionnalité du bouton de redirection vers voitures.html
        document.getElementById('redirect-voitures').addEventListener('click', function() {
            window.location.href = 'voitures.html';
        });

        // Formater une date
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('fr-FR', options);
        }

        // Fonction pour charger les réservations de l'utilisateur
        async function loadUserReservations() {
        console.log("=== DÉBUT CHARGEMENT DES RÉSERVATIONS ===");
        console.log("Token disponible:", !!token);
        console.log("Utilisateur connecté:", currentUser);
        const reservationsLoading = document.getElementById('reservations-loading');
        const reservationsContainer = document.getElementById('reservations-container');
        const noReservations = document.getElementById('no-reservations');
        

        // IMPORTANT : Vider le conteneur avant d'ajouter les nouvelles réservations
        reservationsContainer.innerHTML = '';
            
            // Réinitialiser l'affichage
        reservationsLoading.style.display = 'block';
        noReservations.style.display = 'none';


    try {
        // Vérifier si l'utilisateur est connecté
        if (!token || !currentUser._id) {
            reservationsLoading.textContent = 'Vous devez être connecté pour voir vos réservations.';
            return;
        }
        
        console.log("Tentative de récupération des réservations avec le token:", token);
        
        // Faire une requête pour obtenir les réservations de l'utilisateur
        const response = await fetch(`http://localhost:3000/api/reservations/user`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        console.log("Statut de la réponse:", response.status);
        
        if (!response.ok) {
            throw new Error('Erreur lors du chargement des réservations');
        }
        
        const responseData = await response.json();
        console.log("Données reçues:", responseData);
        
        // Masquer le message de chargement
        reservationsLoading.style.display = 'none';
        
        // Vérifier la structure de la réponse
        let reservations = [];
        if (Array.isArray(responseData)) {
            // Si c'est déjà un tableau
            reservations = responseData;
        } else if (responseData.data && Array.isArray(responseData.data)) {
            // Si la réponse a une propriété 'data' qui est un tableau
            reservations = responseData.data;
        } else if (responseData.reservations && Array.isArray(responseData.reservations)) {
            // Si la réponse a une propriété 'reservations' qui est un tableau
            reservations = responseData.reservations;
        } else {
            // Si nous ne pouvons pas trouver un tableau dans la réponse
            console.error("Format de réponse inattendu:", responseData);
            throw new Error('Format de réponse inattendu');
        }
        
        if (reservations.length === 0) {
            noReservations.style.display = 'block';
            return;
        }
        
        // Pour chaque réservation, récupérer les détails de la voiture
        for (const reservation of reservations) {
            try {
                console.log("Traitement de la réservation:", reservation);
                console.log("ID de la voiture dans la réservation:", reservation.voiture);
                console.log("Type de l'ID:", typeof reservation.voiture);
                console.log("URL qui sera appelée:", `http://localhost:3000/api/cars/${reservation.voiture}`);
        
                
                if (!reservation.voiture) {
                    console.error("La réservation n'a pas d'ID de voiture:", reservation);
                    continue; // Passer à la réservation suivante
                }
                
                const carResponse = await fetch(`http://localhost:3000/api/cars/${reservation.voiture}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                console.log("Réponse du serveur - status:", carResponse.status);

                
                if (!carResponse.ok) {
                    throw new Error(`Erreur lors du chargement des détails de la voiture ${reservation.voiture}`);
                }
                
                const car = await carResponse.json();
                console.log("Données de la voiture:", car);
                
                // Créer un élément pour afficher la voiture réservée
              // Dans la boucle qui affiche les réservations
                const reservationElem = document.createElement('div');
                reservationElem.innerHTML = `
                    <div style="margin-bottom: 20px;">
                        <h4>${car.marque} ${car.modele} (${car.annee})</h4>
                        <p><strong>Prix:</strong> ${car.prix} €</p>
                        <p><strong>Période de réservation:</strong> Du ${formatDate(reservation.dateDebut)} au ${formatDate(reservation.dateFin)}</p>
                        <p><strong>Statut:</strong> ${reservation.statut}</p>
                        <p>${car.description || ''}</p>
                        ${reservation.statut === 'confirmée' ? `
                            <button onclick="annulerReservation('${reservation._id}')" 
                                    style="background-color: #ff4444; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">
                                Annuler la réservation
                            </button>
                        ` : ''}
                        <hr>
                    </div>
                `;
                                
                reservationsContainer.appendChild(reservationElem);
            } catch (error) {
                console.error('Erreur:', error);
                // Afficher un message d'erreur pour cette voiture spécifique
                const errorElem = document.createElement('div');
                errorElem.innerHTML = `
                    <div style="margin-bottom: 20px;">
                        <p>Erreur lors du chargement des détails de la voiture pour cette réservation</p>
                        <hr>
                    </div>
                `;
                reservationsContainer.appendChild(errorElem);
            }
        }
    } catch (error) {
        console.error('Erreur:', error);
        reservationsLoading.textContent = 'Erreur lors du chargement des réservations: ' + error.message;
    }
}

        // Fonction pour annuler une réservation
        async function annulerReservation(reservationId) {
            if (!confirm('Êtes-vous sûr de vouloir annuler cette réservation ?')) {
                return;
            }

            try {
                const token = localStorage.getItem('token');
                
                const response = await fetch(`http://localhost:3000/api/reservations/${reservationId}/cancel`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Erreur lors de l\'annulation');
                }

                alert('Réservation annulée avec succès');
                // Recharger les réservations pour voir la mise à jour
                loadUserReservations();
                
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors de l\'annulation: ' + error.message);
            }
        }

        // Charger les réservations au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            loadUserReservations();
        });



        // Charger les réservations au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            loadUserReservations();
        });
    </script>
</body>
</html>
