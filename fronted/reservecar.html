<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation de voiture</title>
</head>
<body>
  <header>
    <h1>Réservation de voiture</h1>
    <nav>
      <a href="Accueil.html">Accueil</a> |
      <a href="voitures.html">Retour aux voitures</a> |
      <span id="user-links">
        <span id="username-display"></span> |
        <a href="dashboard.html">Tableau de bord</a> |
        <a href="#" id="logout-link">Déconnexion</a>
      </span>
    </nav>
  </header>
  
  <main>
    <div id="loading-message">Chargement des détails de la voiture...</div>
    
    <div id="car-details" style="display: none;">
      <!-- Les détails de la voiture seront injectés ici par JavaScript -->
    </div>
    
    <div id="reservation-form" style="display: none;">
      <h3>Réserver cette voiture</h3>
      <form id="booking-form">
        <div>
          <label for="date-debut">Date de début:</label>
          <input type="date" id="date-debut" name="date-debut" required>
        </div>
        <div>
          <label for="date-fin">Date de fin:</label>
          <input type="date" id="date-fin" name="date-fin" required>
        </div>
        <div>
          <button type="submit">Confirmer la réservation</button>
        </div>
      </form>
    </div>
    
    <div id="error-message" style="display: none; color: red;">
      <!-- Messages d'erreur éventuels -->
    </div>
    
    <div id="success-message" style="display: none; color: green;">
      <!-- Message de succès après réservation -->
    </div>
  </main>

  <script>
    // Vérifier si l'utilisateur est connecté
    function checkAuthentication() {
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      const isLoggedIn = token && user;
      
      if (!isLoggedIn) {
        // Rediriger vers la page de connexion si l'utilisateur n'est pas connecté
        window.location.href = 'login.html?redirect=reservecar.html' + window.location.search;
        return false;
      }
      
      if (user.name) {
        document.getElementById('username-display').textContent = `Bonjour, ${user.name}`;
      }
      
      return true;
    }
    
    // Déconnexion
    document.getElementById('logout-link').addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'Accueil.html';
    });
    
    // Obtenir l'ID de la voiture à partir de l'URL
    function getCarIdFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      const carId = urlParams.get('id');
      return carId;
    }
    
    // Charger les détails de la voiture
    async function loadCarDetails() {
      const carId = getCarIdFromUrl();
      const loadingMessage = document.getElementById('loading-message');
      const carDetailsElement = document.getElementById('car-details');
      const errorMessage = document.getElementById('error-message');
      
      if (!carId) {
        loadingMessage.style.display = 'none';
        errorMessage.textContent = 'Aucune voiture spécifiée.';
        errorMessage.style.display = 'block';
        return;
      }
      
      try {
        const response = await fetch(`http://localhost:3000/api/cars/${carId}`);
        
        if (!response.ok) {
          throw new Error('Erreur lors du chargement des détails de la voiture');
        }
        
        const car = await response.json();
        
        // Masquer le message de chargement
        loadingMessage.style.display = 'none';
        
        // Afficher les détails de la voiture
        carDetailsElement.innerHTML = `
          <h2>${car.marque} ${car.modele} (${car.annee})</h2>
          <p><strong>Prix:</strong> ${car.prix} €</p>
          <p><strong>Description:</strong> ${car.description || 'Aucune description disponible.'}</p>
          <p><strong>Caractéristiques:</strong></p>
          <ul>
            ${car.couleur ? `<li>Couleur: ${car.couleur}</li>` : ''}
            ${car.kilometrage ? `<li>Kilométrage: ${car.kilometrage} km</li>` : ''}
            ${car.carburant ? `<li>Carburant: ${car.carburant}</li>` : ''}
            ${car.transmission ? `<li>Transmission: ${car.transmission}</li>` : ''}
          </ul>
        `;
        
        carDetailsElement.style.display = 'block';
        document.getElementById('reservation-form').style.display = 'block';
        
      } catch (error) {
        console.error('Erreur:', error);
        loadingMessage.style.display = 'none';
        errorMessage.textContent = 'Erreur lors du chargement des détails de la voiture. Veuillez réessayer plus tard.';
        errorMessage.style.display = 'block';
      }
    }
    
    // Gérer la soumission du formulaire de réservation
    document.getElementById('booking-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const carId = getCarIdFromUrl();
      const userId = JSON.parse(localStorage.getItem('user') || '{}')._id;
      const token = localStorage.getItem('token');
      const dateDebut = document.getElementById('date-debut').value;
      const dateFin = document.getElementById('date-fin').value;
      
      const errorMessage = document.getElementById('error-message');
      const successMessage = document.getElementById('success-message');
      
      // Validation de base
      if (!dateDebut || !dateFin) {
        errorMessage.textContent = 'Veuillez sélectionner les dates de réservation.';
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
        return;
      }
      
      if (new Date(dateDebut) >= new Date(dateFin)) {
        errorMessage.textContent = 'La date de fin doit être postérieure à la date de début.';
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
        return;
      }
      
      try {
        const response = await fetch('http://localhost:3000/api/reservations', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            voiture: carId,
            utilisateur: userId,
            dateDebut: dateDebut,
            dateFin: dateFin
          })
        });
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || 'Erreur lors de la réservation');
        }
        
        const reservation = await response.json();
        
        // Afficher le message de succès
        errorMessage.style.display = 'none';
        successMessage.textContent = 'Réservation effectuée avec succès ! Référence de réservation: ' + reservation._id;
        successMessage.style.display = 'block';
        
        // Désactiver le formulaire
        document.getElementById('booking-form').reset();
        document.getElementById('booking-form').style.display = 'none';
        
        // Ajouter un lien vers le tableau de bord
        successMessage.innerHTML += '<p>Vous pouvez consulter vos réservations dans votre <a href="dashboard.html">tableau de bord</a>.</p>';
        
      } catch (error) {
        console.error('Erreur:', error);
        errorMessage.textContent = error.message || 'Erreur lors de la réservation. Veuillez réessayer plus tard.';
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
      }
    });
    
    // Initialiser la page
    document.addEventListener('DOMContentLoaded', function() {
      if (checkAuthentication()) {
        loadCarDetails();
      }
    });
  </script>
</body>
</html>
